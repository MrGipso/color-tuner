<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#1f232b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <!-- monitor -->
  <rect x="20" y="20" width="88" height="62" rx="8" fill="#d8dee9"/>
  <rect x="25" y="25" width="78" height="52" rx="4" fill="url(#screen)"/>
  <rect x="58" y="82" width="12" height="8" fill="#aeb6c4"/>
  <rect x="46" y="89" width="36" height="5" rx="2.5" fill="#d8dee9"/>
  <!-- RGB circles, additive -->
  <g style="mix-blend-mode:screen" opacity="0.95">
    <circle cx="57" cy="45" r="15" fill="#ff3b3b"/>
    <circle cx="71" cy="45" r="15" fill="#2fe06a" style="mix-blend-mode:screen"/>
    <circle cx="64" cy="57" r="15" fill="#3b7bff" style="mix-blend-mode:screen"/>
  </g>
  <!-- sliders -->
  <rect x="24" y="101" width="80" height="4" rx="2" fill="#4c566a"/>
  <rect x="24" y="101" width="52" height="4" rx="2" fill="#88c0d0"/>
  <circle cx="76" cy="103" r="6" fill="#eceff4" stroke="#88c0d0" stroke-width="2"/>
</svg>
